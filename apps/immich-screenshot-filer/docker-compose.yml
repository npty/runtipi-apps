services:
  immich-screenshot-filer:
    image: oven/bun:1.2-alpine
    restart: unless-stopped
    environment:
      - IMMICH_URL=${FILER_IMMICH_URL}
      - IMMICH_API_KEY=${FILER_IMMICH_API_KEY}
      - ALBUM_ID=${FILER_ALBUM_ID}
      - INTERVAL=${FILER_INTERVAL:-60}
      - DRY_RUN=${FILER_DRY_RUN:-false}
      - SLIPS_MODE=${FILER_SLIPS_MODE:-off}
      - SLIPS_ALBUM_ID=${FILER_SLIPS_ALBUM_ID:-e4feb9fc-17ee-40e5-9766-fa80d83fa623}
      - BACKFILL=true
      - TZ=${TZ}
    # Source: src/filer.ts in this repo, inlined so the app needs no image build.
    command:
      - bun
      - -e
      - |
        // Immich filer (Bun + TypeScript, no dependencies).
        //
        // Every INTERVAL seconds, finds recently changed images on the Immich timeline
        // that have no camera model, sorts each into the first rule that matches,
        // adds it to that rule's album and archives it.
        //
        // Rules, in order:
        //   screenshots  Apple's EXIF UserComment "Screenshot" (iPhone/iPad/Mac, kept when cropped)
        //   slips        bank/payment slips: bank-app filename, or slip wording in Immich's OCR text
        //
        // Each rule has a mode: "on" (file), "dry" (log only) or "off".
        // NOTE: this file is inlined into docker-compose.yml, so it must not contain the dollar sign.

        type Exif = { make?: string | null; model?: string | null; exifImageWidth?: number | null };
        type Asset = { id: string; originalFileName: string; createdAt?: string; updatedAt?: string; exifInfo?: Exif };
        type Mode = "on" | "dry" | "off";
        type Verdict = { rule: string } | "none" | "wait";

        const env = (k: string, d?: string): string => {
          const v = process.env[k];
          if (v !== undefined && v !== "") return v;
          if (d !== undefined) return d;
          throw new Error("missing env " + k);
        };
        const isTrue = (v: string) => ["1", "true", "yes"].includes(v.toLowerCase());
        const mode = (k: string, d: Mode): Mode => {
          const v = env(k, d).toLowerCase();
          return v === "on" || v === "dry" || v === "off" ? v : d;
        };

        let URL_ = env("IMMICH_URL");
        while (URL_.endsWith("/")) URL_ = URL_.slice(0, -1);
        const KEY = env("IMMICH_API_KEY");
        const INTERVAL = Number(env("INTERVAL", "60"));
        const LOOKBACK_MIN = Number(env("LOOKBACK_MINUTES", "30"));
        const OCR_WAIT_HOURS = Number(env("OCR_WAIT_HOURS", "6"));
        const BACKFILL = isTrue(env("BACKFILL", "true"));
        const HEAD_BYTES = 256 * 1024;

        // Back-compat: DRY_RUN=true used to switch the screenshot rule to log-only.
        const RULES: Record<string, { mode: Mode; album: string }> = {
          screenshots: {
            mode: mode("SCREENSHOTS_MODE", isTrue(env("DRY_RUN", "false")) ? "dry" : "on"),
            album: env("SCREENSHOTS_ALBUM_ID", env("ALBUM_ID", "")),
          },
          slips: {
            mode: mode("SLIPS_MODE", "off"),
            album: env("SLIPS_ALBUM_ID", ""),
          },
        };

        // Exact bytes of an EXIF UserComment set to "Screenshot" (ASCII charset header).
        const MARKER = new TextEncoder().encode("ASCII\0\0\0Screenshot");
        // Makes seen on screenshots and app-saved images; real camera photos have a model set.
        const NO_CAMERA_MAKES = new Set<string | null | undefined>([null, undefined, "", "Apple Computer Inc."]);

        // Bank and broker apps that save slips with their own file names (Krungthai, Dime FX, ...).
        const SLIP_FILENAME = /^(STKB|TSKB|TSKS|STKS|FX\d)/i;
        // Wording found on transfer/payment slips (English and Thai).
        const SLIP_TEXT = new RegExp(
          [
            "scan (this|the) QR code to verify",
            "successful(ly)? (transfer|payment|paid|top ?up|bill)",
            "(transfer|payment) successful",
            "โอนเงินสำเร็จ", "ชำระเงินสำเร็จ", "เติมเงินสำเร็จ", "จ่ายบิลสำเร็จ",
            "รหัสอ้างอิง", "เลขที่รายการ", "ค่าธรรมเนียม",
            "Transaction (ID|Details|No|Ref)", "Ref(erence)? ?(No|ID|Code|number)", "e-?Receipt", "e-?slip",
          ].join("|"),
          "i",
        );

        const log = (...a: unknown[]) => console.log(new Date().toISOString(), ...a);
        const sleep = (ms: number) => new Promise((r) => setTimeout(r, ms));

        async function api(method: string, path: string, body?: unknown, headers: Record<string, string> = {}) {
          const res = await fetch(URL_ + "/api" + path, {
            method,
            headers: {
              "x-api-key": KEY,
              Accept: "application/json",
              ...(body !== undefined ? { "Content-Type": "application/json" } : {}),
              ...headers,
            },
            body: body !== undefined ? JSON.stringify(body) : undefined,
            signal: AbortSignal.timeout(60_000),
          });
          if (!res.ok) throw new Error(method + " " + path + " -> " + res.status + " " + (await res.text()).slice(0, 200));
          return res;
        }

        async function* candidates(updatedAfter?: string): AsyncGenerator<Asset> {
          let page: number | null = 1;
          while (page) {
            const body: Record<string, unknown> = {
              type: "IMAGE", visibility: "timeline", withExif: true, size: 500, page, order: "desc",
            };
            if (updatedAfter) body.updatedAfter = updatedAfter;
            const { assets } = (await (await api("POST", "/search/metadata", body)).json()) as {
              assets: { items: Asset[]; nextPage: string | null };
            };
            for (const a of assets.items) {
              const e = a.exifInfo ?? {};
              if (e.model || !NO_CAMERA_MAKES.has(e.make)) continue;
              if (!e.exifImageWidth) continue; // metadata not extracted yet; picked up on a later pass
              yield a;
            }
            page = assets.nextPage ? Number(assets.nextPage) : null;
          }
        }

        function includes(hay: Uint8Array, needle: Uint8Array): boolean {
          outer: for (let i = hay.indexOf(needle[0]); i !== -1 && i <= hay.length - needle.length; i = hay.indexOf(needle[0], i + 1)) {
            for (let j = 1; j < needle.length; j++) if (hay[i + j] !== needle[j]) continue outer;
            return true;
          }
          return false;
        }

        async function hasScreenshotMarker(id: string): Promise<boolean> {
          const res = await api("GET", "/assets/" + id + "/original", undefined, {
            Range: "bytes=0-" + (HEAD_BYTES - 1),
            Accept: "*/*",
          });
          return includes(new Uint8Array(await res.arrayBuffer()).subarray(0, HEAD_BYTES), MARKER);
        }

        async function ocrText(id: string): Promise<string> {
          const boxes = (await (await api("GET", "/assets/" + id + "/ocr")).json()) as { text: string }[];
          return boxes.map((b) => b.text).join(" ").replace(/\s+/g, " ");
        }

        async function classify(a: Asset): Promise<Verdict> {
          if (RULES.screenshots.mode !== "off" && (await hasScreenshotMarker(a.id))) return { rule: "screenshots" };
          if (RULES.slips.mode !== "off") {
            if (SLIP_FILENAME.test(a.originalFileName)) return { rule: "slips" };
            const text = await ocrText(a.id);
            if (SLIP_TEXT.test(text)) return { rule: "slips" };
            // OCR runs in the background after upload; give it time before deciding.
            const ageH = (Date.now() - Date.parse(a.createdAt ?? "")) / 3_600_000;
            if (!text && ageH < OCR_WAIT_HOURS) return "wait";
          }
          return "none";
        }

        async function fileAssets(rule: string, ids: string[]) {
          const r = RULES[rule];
          if (r.mode === "dry") return log("DRY RUN " + rule + ": would file " + ids.length);
          await api("PUT", "/albums/" + r.album + "/assets", { ids });
          await api("PUT", "/assets", { ids, visibility: "archive" });
          log(rule + ": filed " + ids.length);
        }

        async function process_(list: Asset[], checked: Set<string>, pending: Map<string, Asset>) {
          const hits: Record<string, string[]> = {};
          for (const a of list) {
            const key = a.id + "|" + a.updatedAt;
            if (checked.has(key)) continue;
            let v: Verdict;
            try {
              v = await classify(a);
            } catch (err) {
              log("skip", a.originalFileName, String(err));
              continue;
            }
            if (v === "wait") {
              pending.set(a.id, a);
              continue;
            }
            pending.delete(a.id);
            checked.add(key);
            if (v !== "none") {
              (hits[v.rule] ??= []).push(a.id);
              log(v.rule + ":", a.originalFileName);
            }
          }
          for (const [rule, ids] of Object.entries(hits))
            for (let i = 0; i < ids.length; i += 200) await fileAssets(rule, ids.slice(i, i + 200));
          return Object.values(hits).reduce((n, ids) => n + ids.length, 0);
        }

        async function scan(updatedAfter: string | undefined, checked: Set<string>, pending: Map<string, Asset>) {
          const batch: Asset[] = [];
          const seen = new Set<string>();
          let n = 0;
          for await (const a of candidates(updatedAfter)) {
            batch.push(a);
            seen.add(a.id);
            if (batch.length >= 200) n += await process_(batch.splice(0), checked, pending);
          }
          n += await process_(batch, checked, pending);
          // Recheck assets still waiting for OCR, even after they fall out of the lookback window.
          const waiting = [...pending.values()].filter((a) => !seen.has(a.id));
          if (waiting.length) n += await process_(waiting, checked, pending);
          return n;
        }

        async function main() {
          for (const [name, r] of Object.entries(RULES)) {
            if (r.mode === "off") continue;
            if (!r.album) throw new Error(name + ": album ID is required when the rule is on or dry");
            await api("GET", "/albums/" + r.album + "?withoutAssets=true"); // fail fast on bad URL/key/album
          }
          log("started: " + Object.entries(RULES).map(([n, r]) => n + "=" + r.mode).join(", ") + ", every " + INTERVAL + "s");
          const checked = new Set<string>();
          const pending = new Map<string, Asset>();
          if (BACKFILL) {
            log("backfill: checking the whole timeline once");
            log("backfill done: " + (await scan(undefined, checked, pending)) + " matched");
          }
          while (true) {
            const since = new Date(Date.now() - LOOKBACK_MIN * 60_000).toISOString();
            try {
              await scan(since, checked, pending);
            } catch (err) {
              log("error:", String(err)); // keep running through Immich restarts/outages
            }
            if (checked.size > 50_000) checked.clear();
            await sleep(INTERVAL * 1000);
          }
        }

        main().catch((err) => {
          log("fatal:", String(err));
          process.exit(1);
        });
    x-runtipi:
      is_main: true
x-runtipi:
  schema_version: 2
  overrides: []
